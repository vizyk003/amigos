<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Mit csinálunk – képopciók</title>
<style>:root{--green:#38B285;--deep:#146247;--paper:#F6FBF9;--ink:#111D18;--ink2:#43524A;--sun:#F2B400}
body{margin:0;padding:40px 24px 80px;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1{margin:0 0 4px;font-size:24px}p.lead{margin:0 0 36px;color:var(--ink2)}h2{margin:40px 0 16px;font-size:20px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;max-width:1320px}
figure{margin:0}.f{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#DFEEE8}
.f img{width:100%;height:100%;object-fit:cover;display:block}.f.g{background:#EAF3EF}.f.g img{object-fit:contain}
.f figcaption{position:absolute;left:0;right:0;bottom:0;background:var(--deep);color:#fff;padding:8px 14px;font-size:13px}
.lab{margin-top:10px}.lab b{display:block}.lab span{font-size:14px;color:var(--ink2)}.now .f{outline:3px solid var(--sun);outline-offset:4px}</style></head><body>
<h1>Mit csinálunk? – képopciók</h1><p class="lead">Pillérenként válassz egyet (pl. 1B, 2A, 3A, 4A). A sárga keretes a mostani.</p><h2>01 · Rendszeres kórházi látogatások</h2><div class="row"><figure><div class="f"><img src="assets/community/photos/korhaz-toronyepites.jpg" alt=""><figcaption>1A</figcaption></div><div class="lab"><b>1A · Toronyépítés a kórházi ágynál</b><span>csak a gyermek keze látszik</span></div></figure><figure><div class="f"><img src="assets/community/photos/korhaz-felolvasas-agynal.jpg" alt=""><figcaption>1B</figcaption></div><div class="lab"><b>1B · Felolvasás az ágy mellett</b><span>egyértelműen kórház</span></div></figure><figure><div class="f"><img src="assets/community/photos/orvosos-jatek.jpg" alt=""><figcaption>1C</figcaption></div><div class="lab"><b>1C · Orvosos játék</b><span>Amigo arca, gyermek háttal</span></div></figure><figure><div class="f"><img src="assets/community/photos/kisvasut-jatek.jpg" alt=""><figcaption>1D</figcaption></div><div class="lab"><b>1D · Kisvasút</b><span>most a Munkánk heróban</span></div></figure><figure class="now"><div class="f"><img src="assets/community/photos/kozos-jatek-asztalnal.jpg" alt=""><figcaption>1E</figcaption></div><div class="lab"><b>1E · Játék az asztalnál</b><span>ez van most</span></div></figure></div><h2>02 · Eseti kórházi látogatások (Amigo napok)</h2><div class="row"><figure><div class="f"><img src="assets/community/photos/lufis-falfestmeny.jpg" alt=""><figcaption>2A</figcaption></div><div class="lab"><b>2A · Két Amigo a lufis falfestménynél</b><span>kórházi fal, vidám</span></div></figure><figure><div class="f"><img src="assets/community/photos/lufiallatok.jpg" alt=""><figcaption>2B</figcaption></div><div class="lab"><b>2B · Lufiállatok</b><span>részletkép felülről</span></div></figure><figure><div class="f"><img src="assets/community/photos/unneples-tortaval.jpg" alt=""><figcaption>2C</figcaption></div><div class="lab"><b>2C · Ünneplés tortával</b><span>esemény-hangulat</span></div></figure><figure class="now"><div class="f"><img src="assets/community/photos/lufifujas.jpg" alt=""><figcaption>2D</figcaption></div><div class="lab"><b>2D · Lufifújás</b><span>ez van most</span></div></figure></div><h2>03 · Dobozba zárt Amigos-élmény</h2><div class="row"><figure><div class="f"><img src="assets/community/photos/lego-es-szinezes.jpg" alt=""><figcaption>3A</figcaption></div><div class="lab"><b>3A · LEGO, színezők, eszközök</b><span>saját fejlesztésű eszközök</span></div></figure><figure><div class="f"><img src="assets/community/photos/kezmuves-foglalkozas.jpg" alt=""><figcaption>3B</figcaption></div><div class="lab"><b>3B · Kézműves asztal</b><span>sok eszköz, alkotás</span></div></figure><figure><div class="f"><img src="assets/community/photos/rajzolas-asztalnal.jpg" alt=""><figcaption>3C</figcaption></div><div class="lab"><b>3C · Rajzolás egy kislánnyal</b><span>a kislány profilból látszik</span></div></figure><figure class="now"><div class="f"><img src="assets/community/photos/lift-dobozzal.jpg" alt=""><figcaption>3D</figcaption></div><div class="lab"><b>3D · Két Amigo dobozzal a liftben</b><span>ez van most</span></div></figure></div><h2>04 · Otthon is segítünk (online)</h2><div class="row"><figure class="now"><div class="f g"><img src="assets/community/photos/../../kalandozz/kalandor.png" alt=""><figcaption>4A</figcaption></div><div class="lab"><b>4A · Amigos Kalandor</b><span>ez van most (grafika)</span></div></figure><figure><div class="f g"><img src="assets/community/photos/../../kalandozz/nagyvilag.png" alt=""><figcaption>4B</figcaption></div><div class="lab"><b>4B · Kalandozzunk együtt</b><span>grafika</span></div></figure><figure><div class="f g"><img src="assets/community/photos/../../kalandozz/szintlepo.png" alt=""><figcaption>4C</figcaption></div><div class="lab"><b>4C · SzintLépő</b><span>grafika</span></div></figure><figure><div class="f g"><img src="assets/community/photos/../../kalandozz/mi-leszek.png" alt=""><figcaption>4D</figcaption></div><div class="lab"><b>4D · Mi leszek, ha nagy leszek?</b><span>grafika</span></div></figure></div></body></html>
